<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa de Proyectos | ArquiTec Sonora</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v7.3.0/ol.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    #map {
      position: relative;
      width: 100%;
      height: calc(100vh - var(--header-height));
      margin-top: var(--header-height);
    }
    
    .map-controls {
      position: absolute;
      top: 1rem;
      right: 1rem;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    
    .map-control-btn {
      background: white;
      border: none;
      border-radius: var(--border-radius-md);
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-md);
      cursor: pointer;
      transition: var(--transition-normal);
    }
    
    .map-control-btn:hover {
      background-color: var(--primary-light);
      color: white;
    }
    
    .map-filters {
      position: absolute;
      top: 1rem;
      left: 1rem;
      z-index: 1000;
      background: white;
      padding: var(--spacing-md);
      border-radius: var(--border-radius-md);
      box-shadow: var(--shadow-md);
    }
    
    .project-filter {
      margin-bottom: var(--spacing-sm);
    }
    
    .project-filter button {
      background: var(--gray-200);
      border: none;
      padding: var(--spacing-xs) var(--spacing-md);
      margin-right: var(--spacing-xs);
      border-radius: var(--border-radius-sm);
      cursor: pointer;
      transition: var(--transition-normal);
    }
    
    .project-filter button.active {
      background: var(--primary-color);
      color: white;
    }
    
    .project-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.7);
      z-index: 2000;
    }
    
    .modal-content {
      position: relative;
      background-color: white;
      margin: 10% auto;
      padding: var(--spacing-lg);
      width: 80%;
      max-width: 600px;
      border-radius: var(--border-radius-lg);
      box-shadow: var(--shadow-xl);
    }
    
    .close-modal {
      position: absolute;
      top: var(--spacing-md);
      right: var(--spacing-md);
      font-size: var(--font-size-xl);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Header con navegación -->
  <header class="header fixed">
    <div class="container">
      <div class="logo">
        <a href="index.html">
          <h1>ArquiTec<span>Sonora</span></h1>
        </a>
      </div>
      <nav class="nav-menu">
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="index.html#proyectos">Proyectos</a></li>
          <li><a href="mapa.html" class="active">Mapa</a></li>
          <li><a href="index.html#equipo">Equipo</a></li>
          <li><a href="index.html#contacto">Contacto</a></li>
        </ul>
      </nav>
      <button class="theme-toggle" id="themeToggle">
        <i class="fas fa-sun"></i>
        <i class="fas fa-moon"></i>
      </button>
    </div>
  </header>

  <!-- Contenedor del mapa -->
  <div id="map"></div>
  
  <!-- Controles del mapa -->
  <div class="map-controls">
    <button class="map-control-btn" id="zoomIn" title="Acercar">
      <i class="fas fa-plus"></i>
    </button>
    <button class="map-control-btn" id="zoomOut" title="Alejar">
      <i class="fas fa-minus"></i>
    </button>
    <button class="map-control-btn" id="locateMe" title="Mi ubicación">
      <i class="fas fa-location-crosshairs"></i>
    </button>
    <button class="map-control-btn" id="toggleFilters" title="Filtros">
      <i class="fas fa-filter"></i>
    </button>
  </div>
  
  <!-- Filtros del mapa -->
  <div class="map-filters">
    <h3>Filtrar proyectos</h3>
    <div class="project-filter">
      <button data-project-type="all" class="active">Todos</button>
      <button data-project-type="residential">Residencial</button>
      <button data-project-type="commercial">Comercial</button>
      <button data-project-type="industrial">Industrial</button>
    </div>
  </div>
  
  <!-- Contenedor para notificaciones -->
  <div class="notification-container"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/ol@v7.3.0/dist/ol.js"></script>
  <script src="map.js"></script>
  <script src="script.js"></script>
</body>
</html>
